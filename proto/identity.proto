syntax = "proto3";

package identity;

option go_package = "github.com/BlackHole55/unishare-proto/identity;identity";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_BANNED = 2;
}

enum UserRole {
  ROLE_USER = 0;
  ROLE_MODERATOR = 1;
  ROLE_ADMIN = 2;
}

// Identity Service
service IdentityService {
  // AUTH: Register a new user
  rpc Register (RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  // AUTH: Log in user
  rpc Login (LoginRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }
  
  // READ: Get a single user by ID
  rpc GetUser (GetUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}"
    };
  }

  // READ: List users with pagination
  rpc ListUsers (GetUsersRequest) returns (GetUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/users"
    };
  }

  // UPDATE: Update user profile details
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      patch: "/api/v1/users/{id}"
      body: "*"
    };
  }

  // DELETE: Remove a user account
  rpc DeleteUser (DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/users/{user_id}"
    };
  }

  // ADMIN: Ban a user
  rpc BanUser (BanUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/users/{user_id}/ban"
      body: "*"
    };
  }

  // ADMIN: Unban a user
  rpc UnbanUser (UnbanUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/users/{user_id}/unban"
      body: "*"
    };
  }

  // ADMIN: Promote user to moderator
  rpc PromoteToModerator (PromoteToModeratorRequest) returns (UserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{user_id}/promote"
      body: "*"
    };
  }

  // ADMIN: Demote user from moderator role
  rpc DemoteFromModerator (DemoteFromModeratorRequest) returns (UserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{user_id}/demote"
      body: "*"
    };
  }

  // INTERNAL: Check if user is currently banned  
  rpc CheckUserBanned (CheckUserBannedRequest) returns (CheckUserBannedResponse); 

  //VERIFY CODE BY EMAIL
  rpc VerifyEmail (VerifyEmailRequest) returns (AuthResponse) {
    option (google.api.http) = {
        post: "/api/v1/auth/verify-email"
        body: "*"
    };
  }

  // RESEND CODE 
  rpc ResendVerificationCode (ResendVerificationCodeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
        post: "/api/v1/auth/resend-code"
        body: "*"
    };
  }

  //REFRESH SESSION
  rpc RefreshToken (RefreshTokenRequest) returns (AuthResponse) {
    option (google.api.http) = {
        post: "/api/v1/auth/refresh"
        body: "*"
    };
  }
}

message UserResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  UserRole role = 4;
  UserStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message ResendVerificationCodeRequest {
    string email = 1;
}
message RegisterResponse {
    UserResponse user = 1;
}
message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserResponse user = 3;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message UpdateUserRequest {
  string id = 1;
  string username = 2;
  string email = 3;
  UserRole role = 4;
  UserStatus status = 5;
  google.protobuf.FieldMask update_mask = 6;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetUsersResponse {
  repeated UserResponse users = 1;
  int32 total_count = 2;
}

message DeleteUserRequest {
  string user_id = 1;     
}

message BanUserRequest {
  string user_id = 1;
}

message UnbanUserRequest {
  string user_id = 1;
}

message PromoteToModeratorRequest {
  string user_id = 1;
}

message DemoteFromModeratorRequest {
  string user_id = 1;
}

message CheckUserBannedRequest {
  string user_id = 1;
}

message CheckUserBannedResponse {
  bool is_active = 1;
}

message VerifyEmailRequest {
  string code = 1;
}

message RefreshTokenRequest {
    string refresh_token = 1;
}